name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-mac:
    name: Build macOS app (arm64 + x64)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unsigned (ad-hoc) dmg + zip
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify the app bundles
        run: |
          for app in dist/mac*/Aria.app; do
            echo "== $app"
            codesign --verify --deep --verbose=2 "$app" || true
            plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleIdentifier|LSUIElement|CFBundleShortVersionString'
          done
          ls -lh dist/*.dmg dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aria-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aria-mac
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Aria ${tag#v}" --notes "Unsigned macOS build. See the README for the first-launch steps."
          gh release upload "$tag" dist/*.dmg dist/*.zip -R "$GITHUB_REPOSITORY" --clobber
